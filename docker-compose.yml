services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: development
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_GRAPH: shortagebridge
    ports:
      - "3000:3000"
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb-data:
